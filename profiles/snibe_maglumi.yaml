device: Snibe Maglumi
vendor: Snibe
model: Maglumi_2000Plus
protocol: ASTM_E1394-97
encoding: latin-1
transport:
  mode: tcp
  port: 5001
  host: 0.0.0.0
records:
  H:
    description: "Header Record: Defines the start of a transmission."
    total_fields: 14
    fields:
      - name: record_type
        type: constant
        default: H
        max_length: 1
        required: true

      - name: delimiter_definition
        type: string
        parsing: literal
        max_length: 4
        required: true

      - name: message_control_id
        type: ignored

      - name: access_password
        type: string
        max_length: 10

      - name: sender_name_id
        type: string
        max_length: 40
        required: true

      - name: sender_address
        type: ignored

      - name: reserved_1
        type: ignored

      - name: sender_phone
        type: ignored

      - name: sender_capabilities
        type: ignored

      - name: receiver_id
        type: string
        max_length: 20

      - name: comments_or_special_instructions
        type: ignored

      - name: processing_id
        type: string
        max_length: 2
        required: true

      - name: version_number
        type: string
        max_length: 12
        required: true

      - name: timestamp
        type: string
        max_length: 14
        required: true

  P:
    description: "Patient Information Record"
    total_fields: 2
    repeated: true
    fields:
      - name: record_type
        type: constant
        default: P
        max_length: 1
        required: true

      - name: sequence_number
        type: string
        max_length: 3
        required: true

  O:
    description: "Order Record: Describes tests to be performed on a sample."
    total_fields: 5
    repeated: true
    fields:
      - name: record_type
        type: constant
        default: O
        max_length: 1
        required: true

      - name: sequence_number
        type: string
        max_length: 3
        required: true

      - name: sample_id
        type: string
        max_length: 20
        required: true

      - name: instrument_specimen_id
        type: ignored

      - name: universal_test_id
        type: component
        required: true
        repeated: true
        fields:
          - name: assay_name
            type: string
            max_length: 50
            required: true

  R:
    description: "Result Record: Contains the result for a single test."
    total_fields: 14
    repeated: true
    fields:
      - name: record_type
        type: constant
        default: R
        max_length: 1
        required: true

      - name: sequence_number
        type: string
        max_length: 10
        required: true

      - name: universal_test_id
        type: component
        required: true
        fields:
          - name: assay_name
            type: string
            max_length: 50
            required: true

      - name: measurement_value
        type: string
        max_length: 25
        required: true

      - name: units
        type: string
        max_length: 12
        required: true

      - name: reference_range
        type: string
        max_length: 50

      - name: result_abnormal_flag
        type: string
        max_length: 5

      - name: nature_of_abnormality
        type: ignored

      - name: result_status
        type: ignored

      - name: norms_changed_at
        type: ignored

      - name: operator_identification
        type: ignored

      - name: test_start_datetime
        type: ignored

      - name: test_completion_datetime
        type: string
        max_length: 14

      - name: instrument_identification
        type: ignored

  L:
    description: "Terminator Record: Marks the end of the transmission."
    total_fields: 3
    fields:
      - name: record_type
        type: constant
        default: L
        max_length: 1
        required: true

      - name: sequence_number
        type: string
        max_length: 3
        required: true

      - name: termination_code
        type: string
        max_length: 1
        required: true

parser:
  strict: False
  repeated_components: ['O-4']
  valid_special_chars: ['STX', 'ETX', 'CR', 'LF', 'ETB', 'CRLF']
  checksum:
    has_checksums: False
  sequence_no:
    has_sequence_numbers: True
    has_multiple_sequence_numbers: False
    is_chunked: False
    message_type: 'single_frame'
  terminator:
    record_termination: 'CR'
    frame_termination: 'ETX'
    message_termination: 'ETX'
quirks: {}
